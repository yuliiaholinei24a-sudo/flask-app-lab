{% extends "base.html" %}

{% block content %}

<section class="books-page">

    <div class="text-center mb-5">
        <h1 class="books-title">Каталог книг</h1>
    </div>

    <div class="row g-4">

        {% for product in products %}

        <div class="col-md-6 col-lg-4">
            <div class="card book-card h-100">

                <div class="book-image-container">
                    <img
                        src="{{ url_for('static', filename=product.image) }}"
                        class="book-cover"
                        alt="Обкладинка книги {{ product.name }}"
                    >
                </div>

                <div class="card-body d-flex flex-column">

                    <h4 class="book-name">
                        {{ product.name }}
                    </h4>

                    <p class="book-author">
                        {{ product.author }}
                    </p>

                    <p class="book-description">
                        {{ product.content }}
                    </p>

                    <div class="mt-auto">
                        <h5 class="book-price">
                            {{ product.price }} грн
                        </h5>

                        <a href="{{ url_for('products.product_detail', product_id=product.id) }}"
                           class="btn book-btn w-100">
                            Детальніше
                        </a>
                    </div>

                </div>
            </div>
        </div>

        {% endfor %}

    </div>
</section>

{% endblock %}
