{% extends "base.html" %}

{% block content %}
<div class="contact-page my-4">
    <div class="resume-section shadow-sm">
        <h2 class="mb-2">Welcome, {{ current_user.username }}!</h2>
        <p class="mb-2">You have successfully logged in to your profile.</p>
        <p class="text-muted mb-4">
            <strong>Email:</strong> {{ current_user.email }}
        </p>

        <div class="d-flex flex-wrap gap-2">
            <a href="{{ url_for('users.users_list') }}" class="btn book-btn">
                Усі користувачі
            </a>
            <a href="{{ url_for('users.logout') }}" class="btn btn-outline-danger">
                Logout
            </a>
        </div>
    </div>
</div>
{% endblock %}
