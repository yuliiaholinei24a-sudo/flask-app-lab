{% extends "base.html" %}

{% block content %}
<div class="auth-card">
    <h1 class="text-center mb-4">Вхід у систему</h1>

    <form method="POST" action="{{ url_for('users.login') }}">
        <div class="mb-3">
            <label for="username" class="form-label">
                Ім'я користувача
            </label>
            <input
                type="text"
                class="form-control"
                id="username"
                name="username"
                required
            >
        </div>

        <div class="mb-4">
            <label for="password" class="form-label">
                Пароль
            </label>
            <input
                type="password"
                class="form-control"
                id="password"
                name="password"
                required
            >
        </div>

        <button type="submit" class="btn book-btn w-100">
            Увійти
        </button>
    </form>
</div>
{% endblock %}
