{% extends "base.html" %}

{% block content %}
<div class="contact-page my-4">
    <h1 class="books-title mb-4">Users List ({{ users|length }})</h1>

    {% if users %}
        <div class="table-responsive users-table">
            <table class="table mb-0 align-middle">
                <thead>
                    <tr>
                        <th scope="col">Id</th>
                        <th scope="col">Username</th>
                        <th scope="col">Email</th>
                    </tr>
                </thead>
                <tbody>
                    {% for user in users %}
                        <tr>
                            <td>{{ user.id }}</td>
                            <td>{{ user.username }}</td>
                            <td>{{ user.email }}</td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    {% else %}
        <div class="resume-section text-center">
            <p class="mb-0">Зареєстрованих користувачів поки що немає.</p>
        </div>
    {% endif %}
</div>
{% endblock %}
