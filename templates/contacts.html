{% extends "base.html" %}

{% block content %}
<div class="contact-page">
    <h1>Контакти</h1>

    <section class="resume-section">
        <h2>Зв'язатися зі мною</h2>

        <div class="contact-item">
            <img src="{{ url_for('static', filename='images/email.png') }}"
                 alt="Email" class="contact-icon">
            <a href="mailto:yuliia.holinei.24a@pnu.edu.ua">yuliia.holinei.24a@pnu.edu.ua</a>
        </div>

        <div class="contact-item">
            <img src="{{ url_for('static', filename='images/github.png') }}"
                 alt="GitHub" class="contact-icon">
            <a href="https://github.com/yuliiaholinei24a-sudo"
               target="_blank" rel="noopener noreferrer">
                Мій GitHub
            </a>
        </div>

        <div class="contact-item">
            <img src="{{ url_for('static', filename='images/linkedin.png') }}"
                 alt="LinkedIn" class="contact-icon">
            <a href="https://www.linkedin.com/in/%D1%8E%D0%BB%D1%96%D1%8F-%D0%B3%D0%BE%D0%BB%D1%96%D0%BD%D0%B5%D0%B9-685b65443/"
               target="_blank" rel="noopener noreferrer">
                Мій LinkedIn
            </a>
        </div>
    </section>

    <section class="resume-section">
        <h2>Написати повідомлення</h2>

        <form action="#" method="get">
            <div class="mb-3">
                <label for="name" class="form-label">Ім'я</label>
                <input type="text" id="name" name="name"
                       class="form-control" placeholder="Ваше ім'я">
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" name="email"
                       class="form-control" placeholder="Ваш email">
            </div>

            <div class="mb-3">
                <label for="message" class="form-label">Повідомлення</label>
                <textarea id="message" name="message"
                          class="form-control" rows="4"
                          placeholder="Ваше повідомлення"></textarea>
            </div>

            <button type="button" class="btn btn-dark">
                Надіслати
            </button>
        </form>
    </section>
</div>
{% endblock %}
